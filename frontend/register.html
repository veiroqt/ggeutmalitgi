<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>회원가입 - 끝말잇기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="page narrow">
    <div class="card">
      <h2>회원가입</h2>
      <form id="register-form">
        <label for="username">아이디</label>
        <input id="username" autocomplete="username" required minlength="3" maxlength="50" />
        <div class="hint" id="username-hint"></div>

        <label for="nickname">닉네임</label>
        <input id="nickname" required minlength="2" maxlength="30" />
        <div class="hint" id="nickname-hint"></div>

        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="4" />

        <label for="password2">비밀번호 확인</label>
        <input id="password2" type="password" autocomplete="new-password" required minlength="4" />

        <div class="error-msg" id="error-msg"></div>

        <button type="submit" class="full-width"><i data-lucide="user-plus"></i> 회원가입</button>
      </form>
      <p style="text-align:center; margin-top:16px;">
        이미 계정이 있으신가요? <a href="login.html">로그인</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
  <script>renderNavbar("register");</script>
</body>
</html>
