<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>마이페이지 - 끝말잇기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="page">
    <div class="card">
      <h2 id="profile-nickname">마이페이지</h2>
      <div class="btn-grid" style="max-width:600px">
        <div class="card" style="margin:0">
          <div class="hint">점수</div>
          <div id="stat-score" style="font-size:1.6rem; font-weight:700">-</div>
        </div>
        <div class="card" style="margin:0">
          <div class="hint">총 게임</div>
          <div id="stat-total" style="font-size:1.6rem; font-weight:700">-</div>
        </div>
        <div class="card" style="margin:0">
          <div class="hint">승률</div>
          <div id="stat-winrate" style="font-size:1.6rem; font-weight:700">-</div>
        </div>
        <div class="card" style="margin:0">
          <div class="hint">최고 연승</div>
          <div id="stat-streak" style="font-size:1.6rem; font-weight:700">-</div>
        </div>
      </div>
      <p class="hint" id="wl-summary" style="margin-top:16px"></p>
    </div>

    <div class="card">
      <h3>최근 게임 기록</h3>
      <table>
        <thead>
          <tr>
            <th>결과</th>
            <th>상대</th>
            <th>사용 단어 수</th>
            <th>점수 변화</th>
            <th>시간</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
  <script>renderNavbar("profile");</script>
</body>
</html>
